bio: |
  My research focuses on inherited metabolic disorders. I conduct basic and translational studies covering neonatal screening system development, novel screening technology innovation, disease molecular mechanisms and precision diagnosis, aiming to improve the early detection of inherited metabolic disorders and reduce the disease burden caused by birth defects.

